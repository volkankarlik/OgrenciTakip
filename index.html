<style>
  :root{
    --paper:#FAF7EF; --ink:#20324A; --ink-soft:#4C5C72; --line:#DAD3C0;
    --sage:#5B7A5B; --sage-bg:#E7EEE3;
    --brick:#A14B33; --brick-bg:#F4E3DC;
    --amber:#93692A; --amber-bg:#F3E7D0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;padding:0 0 3rem;}
  .wrap{max-width:720px;margin:0 auto;padding:0 1.1rem;}
  header.top{padding:1.4rem 1.1rem 1.1rem;border-bottom:1px solid var(--line);margin-bottom:1.2rem;display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;}
  header.top h1{font-family:Georgia,serif;font-weight:600;font-size:1.35rem;margin:0 0 .15rem;}
  header.top p{margin:0;color:var(--ink-soft);font-size:.88rem;}
  #save-status{font-size:.78rem;color:var(--ink-soft);white-space:nowrap;padding-top:.2rem;}
  .backline{display:flex;align-items:center;gap:.4rem;background:none;border:none;color:var(--ink-soft);font-size:.9rem;cursor:pointer;padding:.3rem 0;margin-bottom:.6rem;}
  .backline:hover{color:var(--ink);}
  h2.section{font-family:Georgia,serif;font-weight:600;font-size:1.1rem;margin:1.4rem 0 .6rem;}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;margin-bottom:.9rem;}
  label{display:block;font-size:.85rem;color:var(--ink-soft);margin:.55rem 0 .22rem;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=password],input[type=file],select,textarea{width:100%;padding:.5rem .6rem;border:1px solid var(--line);border-radius:7px;font-size:1rem;background:var(--paper);color:var(--ink);font-family:inherit;}
  textarea{resize:vertical;min-height:3rem;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--sage);outline-offset:1px;}
  button{cursor:pointer;font-family:inherit;font-size:.92rem;border-radius:7px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:.55rem .95rem;}
  button:hover{opacity:.9;}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  button.danger{background:transparent;color:var(--brick);border:1px solid var(--brick-bg);}
  button.small{padding:.32rem .65rem;font-size:.82rem;}
  .row{display:flex;gap:.5rem;flex-wrap:wrap;}
  .row > *{flex:1;min-width:110px;}
  .big-choice{display:flex;flex-direction:column;gap:.8rem;margin-top:1.4rem;}
  .big-btn{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;color:var(--ink);}
  .big-btn strong{display:block;font-size:1.02rem;margin-bottom:.12rem;font-family:Georgia,serif;}
  .big-btn span{color:var(--ink-soft);font-size:.86rem;}
  .big-btn:hover{border-color:var(--sage);}
  .err{color:var(--brick);font-size:.85rem;margin:.4rem 0 0;}
  .muted{color:var(--ink-soft);font-size:.85rem;}
  .list-row{display:flex;align-items:center;justify-content:space-between;padding:.65rem 0;border-bottom:1px solid var(--line);gap:.6rem;}
  .list-row:last-child{border-bottom:none;}
  .tabbar{display:flex;gap:.4rem;margin-bottom:1rem;}
  .tabbar button{flex:1;}
  .tabbar button.active{background:var(--sage);border-color:var(--sage);}
  .tabbar button:not(.active){background:#fff;color:var(--ink);border:1px solid var(--line);}
  .loading{text-align:center;color:var(--ink-soft);padding:2rem 0;}
  details{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:.7rem;}
  details summary{padding:.75rem .9rem;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:.5rem;}
  details summary::-webkit-details-marker{display:none;}
  details[open] summary{border-bottom:1px solid var(--line);}
  details .inner{padding:.9rem;}
  .empty{text-align:center;padding:1.3rem 1rem;color:var(--ink-soft);}
  .gridwrap{overflow-x:auto;margin-bottom:.6rem;}
  table.grid{border-collapse:collapse;width:100%;min-width:280px;}
  table.grid td, table.grid th{padding:.3rem .4rem;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-size:.9rem;}
  table.grid td:first-child, table.grid th:first-child{text-align:left;position:sticky;left:0;background:#fff;min-width:7.5rem;}
  table.grid th{color:var(--ink-soft);font-weight:600;font-size:.78rem;vertical-align:top;}
  .cellbtn{min-width:2.1rem;height:2.1rem;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);font-weight:700;padding:0 .3rem;font-size:1rem;white-space:nowrap;}
  .cellbtn.plus{background:var(--sage-bg);color:var(--sage);border-color:var(--sage-bg);}
  .cellbtn.minus{background:var(--brick-bg);color:var(--brick);border-color:var(--brick-bg);}
  .cellbtn.half{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-bg);}
  .cellbtn.yok{background:#E4E4E0;color:var(--ink-soft);border-color:#E4E4E0;font-size:.78rem;}
  .score-input{width:4.5rem;padding:.3rem .35rem;font-size:.9rem;}
  .col-toolbar{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem;}
  .pill{display:inline-block;font-size:.76rem;padding:.08rem .5rem;border-radius:20px;background:var(--sage-bg);color:var(--sage);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;vertical-align:middle;}
  .entry-row{display:flex;justify-content:space-between;border-left:3px solid var(--sage);padding:.35rem .6rem;margin-bottom:.4rem;font-size:.92rem;}
  .entry-row.neg{border-left-color:var(--brick);}
  .entry-row.half{border-left-color:var(--amber);}
</style>
</head>

  }catch(e){}
  // ilk kez giriş yapan öğretmen için: eski tek-öğretmen verisini bul ve taşı

}

    return true;
  }catch(e){
    setSaveStatus('Kaydedilemedi — tekrar deneniyor');

  }

}

function uid(){ return Math.random().toString(36).slice(2,10); }
const PASSWORD_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function genPassword(){
  let out = '';
  for(let i=0;i<6;i++){ out += PASSWORD_ALPHABET[Math.floor(Math.random()*PASSWORD_ALPHABET.length)]; }
  return out;
}
function allPasswords(){
  const set = new Set();
  Object.values(DATA.classes||{}).forEach(cls=>{
    Object.values(cls.students||{}).forEach(st=>{ if(st.password) set.add(st.password); });
  });
  return set;
}
function genUniquePassword(existingSet){
  let pw;
  do{ pw = genPassword(); }while(existingSet.has(pw));
  existingSet.add(pw);
  return pw;
}
function esc(s){ const d=document.createElement('div'); d.innerText = s==null?'':String(s); return d.innerHTML; }

function migrateData(){
  let changed = false;
  Object.values(DATA.classes||{}).forEach(cls=>{
    Object.values(cls.scales||{}).forEach(sc=>{

        sc.columns=[{id:uid(), label:'Genel', values: sc.values||{}}];
        delete sc.values;
        changed=true;

    });
  });
  return changed;
}

function waitForAuthUser(){

      unsub();
      resolve(user);

  });
}

  if(!el) return;
  let count = 0, timer = null;
  el.style.cursor = 'default';
  el.addEventListener('click', ()=>{
    count++;
    if(timer) clearTimeout(timer);
    timer = setTimeout(()=>{ count = 0; }, 1800);
    if(count>=5){ count=0; callback(); }
  });
}

let qrPollTimer = null;
let qrSessionId = null;
let qrStartedAt = 0;
function makeSessionId(){ return Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10); }

function renderTeacherLoginQR(app){
  qrSessionId = makeSessionId();
  qrStartedAt = Date.now();
  const approveUrl = location.origin + location.pathname + '?approve=' + qrSessionId;
  app.innerHTML = header('QR ile giriş') +
    '<button class="backline" id="back">← Geri</button>'+
    '<div class="card" style="text-align:center;">'+
    '<p class="muted">Telefonunla bu kodu okut, kendi telefonunda onayla — bu ekran otomatik giriş yapacak.</p>'+
    '<div id="qr-box" style="display:flex;justify-content:center;margin:1rem 0;"></div>'+
    '<p class="muted" id="qr-status">Bekleniyor…</p>'+
    '</div>';
  document.getElementById('back').onclick=()=>{ stopQrPoll(); go('teacherLogin'); };
  new QRCode(document.getElementById('qr-box'), {text: approveUrl, width:200, height:200});

  db.collection('loginRequests').doc(qrSessionId).set({status:'pending', createdAt: Date.now()}).catch(()=>{});

  qrPollTimer = setInterval(async ()=>{
    if(Date.now() - qrStartedAt > 180000){
      stopQrPoll();
      const st = document.getElementById('qr-status');
      if(st){ st.textContent = 'Sürenin doldu, yeni kod oluşturmak için geri dönüp tekrar dene.'; }
      db.collection('loginRequests').doc(qrSessionId).delete().catch(()=>{});
      return;
    }
    try{
      const snap = await db.collection('loginRequests').doc(qrSessionId).get();
      if(!snap.exists) return;
      const d = snap.data();
      if(d.status==='approved' && d.email && d.password){
        stopQrPoll();
        const st = document.getElementById('qr-status');
        if(st) st.textContent = 'Onaylandı, giriş yapılıyor…';
        try{
          await firebase.auth().signInWithEmailAndPassword(d.email, d.password);
          CURRENT_UID = firebase.auth().currentUser.uid;
          await loadTeacherData(CURRENT_UID);
          migrateData();
          db.collection('loginRequests').doc(qrSessionId).delete().catch(()=>{});
          go('teacherClasses');
        }catch(e){
          if(st) st.textContent = 'Giriş başarısız oldu, geri dönüp tekrar dene.';
        }
      }
    }catch(e){}
  }, 2000);
}
function stopQrPoll(){
  if(qrPollTimer){ clearInterval(qrPollTimer); qrPollTimer = null; }
}

/* ---------- CLASSES ---------- */
const SCHEDULE_DAYS = [
  {key:'pzt', label:'Pzt', periods:8},
  {key:'sal', label:'Sal', periods:7},
  {key:'car', label:'Çar', periods:7},
  {key:'per', label:'Per', periods:7},
  {key:'cum', label:'Cum', periods:7}
];
function getScheduleDay(dayKey, periods){
  DATA.schedule = DATA.schedule || {};
  if(!DATA.schedule[dayKey]) DATA.schedule[dayKey] = new Array(periods).fill(null);
  while(DATA.schedule[dayKey].length < periods) DATA.schedule[dayKey].push(null);
  return DATA.schedule[dayKey];
}
function renderScheduleCard(classes){
  const maxPeriods = Math.max.apply(null, SCHEDULE_DAYS.map(d=>d.periods));
  let rows = '';
  for(let p=0; p<maxPeriods; p++){
    rows += '<tr><td style="color:var(--ink-soft);font-size:.78rem;">'+(p+1)+'.</td>';
    SCHEDULE_DAYS.forEach(d=>{
      if(p >= d.periods){ rows += '<td></td>'; return; }
      const arr = getScheduleDay(d.key, d.periods);
      const cid = arr[p];
      const cls = cid ? classes.find(c=>c.id===cid) : null;
      rows += '<td><button class="ghost small" data-sched="'+d.key+':'+p+'" style="width:100%;white-space:normal;">'+(cls?esc(cls.name):'—')+'</button></td>';
    });
    rows += '</tr>';
  }
  const header = '<tr><th></th>'+SCHEDULE_DAYS.map(d=>'<th>'+d.label+'</th>').join('')+'</tr>';
  return '<div class="card"><label style="margin-top:0;">Ders Programım</label>'+
    '<p class="muted" style="margin-top:0;">Bir hücreye dokundukça sınıflarının arasında dönüyor, "—" boş demek.</p>'+
    '<div class="gridwrap"><table class="grid"><thead>'+header+'</thead><tbody>'+rows+'</tbody></table></div>'+
    '</div>';
}
function wireScheduleCard(app, classes){
  app.querySelectorAll('[data-sched]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const [dayKey, pStr] = btn.getAttribute('data-sched').split(':');
      const p = parseInt(pStr);
      const dayDef = SCHEDULE_DAYS.find(d=>d.key===dayKey);
      const arr = getScheduleDay(dayKey, dayDef.periods);
      const options = [null].concat(classes.map(c=>c.id));
      const curIdx = options.indexOf(arr[p]);
      const next = options[(curIdx+1) % options.length];
      arr[p] = next;
      const cls = next ? classes.find(c=>c.id===next) : null;
      btn.textContent = cls ? cls.name : '—';
      scheduleSave();
    });
  });
}

function normalizeHeaderCell(s){
  return String(s||'').toLocaleLowerCase('tr').replace(/[^a-zçğıiöşü]/g,'');
}
function looksLikeNameLine(s){
  return /^[A-ZÇĞİÖŞÜ]+(\s[A-ZÇĞİÖŞÜ]+){1,4}$/.test(s.trim());
}
function titleCaseTurkish(s){
  return s.toLocaleLowerCase('tr-TR').split(' ').map(w=> w.length ? w.charAt(0).toLocaleUpperCase('tr-TR')+w.slice(1) : w).join(' ');
}
async function extractNamesFromPdf(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  const items = [];
  let fullText = '';
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    content.items.forEach(it=>{ if(it.str && it.str.trim()){ items.push(it.str.trim()); fullText += ' ' + it.str.trim(); } });
  }
  const names = [];
  const seen = new Set();
  // Yöntem 1: isim ve numara ayrı metin parçaları olarak geliyorsa (art arda)
  for(let i=1; i<items.length; i++){
    if(/^\d+$/.test(items[i]) && looksLikeNameLine(items[i-1])){
      const name = titleCaseTurkish(items[i-1]);
      if(!seen.has(name)){ seen.add(name); names.push(name); }
    }
  }
  // Yöntem 2: isim+numara boşluksuz birleşik parça geliyorsa (ya da yöntem 1 kaçırdıysa), tüm metni tarayıp ayır
  const re = /([A-ZÇĞİÖŞÜ][A-ZÇĞİÖŞÜ\s]{2,60}?)(\d{1,4})/g;
  let m;
  while((m = re.exec(fullText)) !== null){
    const raw = m[1].replace(/\s+/g,' ').trim();
    if(raw.split(' ').length < 2) continue;
    const name = titleCaseTurkish(raw);
    if(!seen.has(name)){ seen.add(name); names.push(name); }
  }
  return names;
}

function findNameHeaderColumns(rows){
  for(let i=0;i<Math.min(rows.length,6);i++){
    const row = rows[i]||[];
    let adIdx=-1, soyadIdx=-1;
    row.forEach((cell,ci)=>{
      const norm = normalizeHeaderCell(cell);
      if(!norm) return;
      if(norm.includes('soyad') && soyadIdx===-1) soyadIdx=ci;
      else if((norm.includes('ad') || norm.includes('isim')) && adIdx===-1 && !norm.includes('soyad')) adIdx=ci;
    });
    if(adIdx!==-1 && soyadIdx!==-1) return {headerRowIndex:i, adIdx, soyadIdx};
  }
  return null;
}

function fmtDateTime(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('tr-TR')+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
}

async function loadVisitInfo(cls, students){
  let visits = visitsCache[cls.id];
  if(!visits){
    visits = await fetchClassVisits(cls.id);
    visitsCache[cls.id] = visits;
  }
  if(!(view==='classPanel' && ctx.classId===cls.id && ctx.tab==='students')) return;
  students.forEach(s=>{
    const mine = visits.filter(v=>v.studentId===s.id);
    const el = document.getElementById('visit-info-'+s.id);
    if(!el) return;
    if(!mine.length){ el.textContent = 'hiç girmedi'; return; }
    const lastTs = Math.max(...mine.map(v=>v.ts));
    el.textContent = mine.length+' kez girdi · son: '+fmtDateTime(lastTs);
  });
}

        await saveDataNow();
        await syncStudentAuth(id, newPw);
        go('classPanel',{classId:cls.id,tab:'students'});
      }else if(act==='save-note'){

        cls.students[id].note=ta.value;

function cellSymbol(v){ return v==='+'?'+':v==='-'?'−':v==='~'?'½':v==='yok'?'Yok':''; }
function markToNumeric(v){ return v==='+'?100:v==='~'?50:v==='-'?0:null; }
function average(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
function collectScaleStudentValues(sc, studentId){
  const vals = [];
  (sc.columns||[]).forEach(col=>{
    const raw = (col.values||{})[studentId];
    if(raw==null || raw==='') return;
    if(sc.type==='addable_score'){
      const n = parseFloat(String(raw).replace(',','.'));
      if(!isNaN(n)) vals.push(n);
    } else {
      const n = markToNumeric(raw);
      if(n!=null) vals.push(n);
    }
  });
  return vals;
}
function scaleStudentPercent(sc, studentId){
  return average(collectScaleStudentValues(sc, studentId));
}
function overallStudentAverage(cls, studentId){
  let all = [];
  Object.values(cls.scales||{}).forEach(sc=>{ all = all.concat(collectScaleStudentValues(sc, studentId)); });
  return average(all);
}
function cellClass(v){ return v==='+'?'plus':v==='-'?'minus':v==='~'?'half':v==='yok'?'yok':''; }
function nextValue(v){ return v===''||v==null?'+':v==='+'?'~':v==='~'?'-':v==='-'?'yok':''; }

function pmGridHtml(students, values, scopeId){
  return '<div class="col-toolbar">'+
    '<button class="ghost small" data-bulk="+" data-scope="'+scopeId+'">Tümünü + yap</button>'+
    '<button class="ghost small" data-bulk="-" data-scope="'+scopeId+'">Tümünü − yap</button>'+
    '<button class="ghost small" data-bulk="" data-scope="'+scopeId+'">Temizle</button>'+
    '</div>'+
    '<div class="gridwrap"><table class="grid"><tbody>'+
    students.map(s=>{
      const v = values[s.id]||'';
      return '<tr><td>'+esc(s.name)+'</td><td><button class="cellbtn '+cellClass(v)+'" data-cell="'+s.id+'" data-scope="'+scopeId+'">'+cellSymbol(v)+'</button></td></tr>';
    }).join('') + '</tbody></table></div>';
}

function scoreGridHtml(students, values, scopeId){
  return '<div class="gridwrap"><table class="grid"><tbody>'+
    students.map(s=>'<tr><td>'+esc(s.name)+'</td><td><input class="score-input" type="text" inputmode="decimal" data-score="'+s.id+'" data-scope="'+scopeId+'" value="'+esc(values[s.id]||'')+'"></td></tr>').join('')+
    '</tbody></table></div>';
}

function scaleGridWideHtml(sc, students){
  const cols = sc.columns||[];
  if(!cols.length) return '<p class="muted">Henüz sütun yok.</p>';
  const header = '<tr><th>Öğrenci</th>' + cols.map(col=>{
    const scope = sc.id+':'+col.id;
    const bulk = sc.type==='addable_pm'
      ? '<div class="row" style="gap:.2rem;margin-top:.25rem;"><button class="ghost small" data-bulk="+" data-scope="'+scope+'">+</button><button class="ghost small" data-bulk="-" data-scope="'+scope+'">−</button><button class="ghost small" data-bulk="" data-scope="'+scope+'">×</button></div>'
      : '';
    return '<th><div>'+esc(col.label)+'</div>'+bulk+'<button class="danger small" style="margin-top:.25rem;" data-delcol="'+sc.id+'" data-colid="'+col.id+'">Sil</button></th>';
  }).join('') + '</tr>';
  const body = students.map(s=>{
    const cells = cols.map(col=>{
      const scope = sc.id+':'+col.id;
      const v = (col.values||{})[s.id]||'';
      if(sc.type==='addable_pm'){
        return '<td><button class="cellbtn '+cellClass(v)+'" data-cell="'+s.id+'" data-scope="'+scope+'">'+cellSymbol(v)+'</button></td>';
      }
      return '<td><input class="score-input" type="text" inputmode="decimal" data-score="'+s.id+'" data-scope="'+scope+'" value="'+esc(v)+'"></td>';
    }).join('');
    return '<tr><td>'+esc(s.name)+'</td>'+cells+'</tr>';
  }).join('');
  return '<div class="gridwrap"><table class="grid"><thead>'+header+'</thead><tbody>'+body+'</tbody></table></div>';
}

function getActiveColumn(sc){
  sc.columns = sc.columns || [];
  if(sc.currentColumnId){
    const existing = sc.columns.find(c=>c.id===sc.currentColumnId);
    if(existing) return existing;
  }
  const today = todayISO();
  const countToday = sc.columns.filter(c=>c.date===today).length;
  const col = {id:uid(), date:today, label: fmtDate(today)+' • Tur '+(countToday+1), values:{}};
  sc.columns.push(col);
  sc.currentColumnId = col.id;
  return col;
}

function speakName(name){
  try{
    if(!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(name);
    u.lang = 'tr-TR';
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}

function wireGridCells(cls, sc, students, root){
  root.querySelectorAll('[data-cell]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const sid = btn.getAttribute('data-cell');
      const scope = btn.getAttribute('data-scope');
      const values = getScopeValues(sc, scope);
      values[sid] = nextValue(values[sid]);
      btn.className = 'cellbtn '+cellClass(values[sid]);
      btn.textContent = cellSymbol(values[sid]);
      scheduleSave();
    });
  });
  root.querySelectorAll('[data-bulk]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const val = btn.getAttribute('data-bulk');
      const scope = btn.getAttribute('data-scope');
      const values = getScopeValues(sc, scope);
      students.forEach(s=>{ values[s.id]=val; });
      scheduleSave();
      go('classPanel',{classId:cls.id,tab:ctx.tab});
    });
  });
  root.querySelectorAll('[data-score]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const sid = inp.getAttribute('data-score');
      const scope = inp.getAttribute('data-scope');
      const values = getScopeValues(sc, scope);
      values[sid] = inp.value.trim();
      scheduleSave();
    });
  });
}

function participationDetailsHtml(sc, students){
  sc.calledIds = sc.calledIds || [];
  const activeCol = (sc.columns||[]).find(c=>c.id===sc.currentColumnId);
  const calledCount = sc.calledIds.filter(id=>students.some(s=>s.id===id)).length;
  const total = students.length;
  const rows = students.map(s=>{
    const called = sc.calledIds.includes(s.id);
    const v = activeCol ? (activeCol.values||{})[s.id] : null;
    return '<tr><td>'+esc(s.name)+'</td><td style="text-align:center;">'+
      '<button class="cellbtn '+(called?cellClass(v||'+'):'')+'" data-activecell="'+s.id+'" data-scaleid="'+sc.id+'">'+(called?cellSymbol(v||'+'):'—')+'</button></td>'+
      '<td><button class="ghost small" data-manualpick="'+sc.id+'" data-studentid="'+s.id+'">Seç</button></td></tr>';
  }).join('');
  const todayCount = (sc.columns||[]).filter(c=>c.date===todayISO()).length;
  const pastCols = (sc.columns||[]).filter(c=>c.id!==sc.currentColumnId);
  let inner =
    scaleRenameHtml(sc) +
    '<p class="muted">Bu tur: '+calledCount+' / '+total+' öğrenci kalktı.'+(todayCount>1?' (Bugün '+todayCount+'. tur)':'')+'</p>'+
    '<div class="row"><button data-pick="'+sc.id+'">🎲 Rastgele öğrenci seç</button>'+
    '<button class="ghost" data-resetcycle="'+sc.id+'">Turu sıfırla</button></div>'+
    '<div id="picked-area-'+sc.id+'" style="margin-top:.7rem;"></div>'+
    '<h3 style="font-size:.9rem;margin:1rem 0 .4rem;">Öğrenciler (bu tur — hücreye dokunarak düzelt)</h3>'+
    '<div class="gridwrap"><table class="grid"><tbody>'+rows+'</tbody></table></div>'+
    (pastCols.length ? '<details style="margin-top:.8rem;"><summary><span>Geçmiş turları düzelt</span><span class="muted">'+pastCols.length+' kayıt</span></summary><div class="inner">'+scaleGridWideHtml({id:sc.id, type:'addable_pm', columns:pastCols}, students)+'</div></details>' : '');
  return '<details data-scaleid="'+sc.id+'" '+(openScales[sc.id]?'open':'')+'><summary><span>'+esc(sc.name)+'</span><span class="pill">Katılım</span></summary>'+
    '<div class="inner" id="scale-'+sc.id+'">'+inner+
    '<div style="margin-top:.7rem;"><button class="danger small" data-delscale="'+sc.id+'">Ölçeği sil</button></div>'+
    '</div></details>';
}

let pendingPick = {};

function wireParticipation(cls, sc, students){
  const root = document.getElementById('scale-'+sc.id);
  if(!root) return;
  wireScaleRename(cls, sc);
  wireGridCells(cls, sc, students, root);
  root.querySelectorAll('[data-delcol]').forEach(btn=>{
    btn.addEventListener('click', async (ev)=>{
      ev.preventDefault();
      if(!confirm('Bu geçmiş turu tamamen silmek istediğine emin misin?')) return;
      const colId = btn.getAttribute('data-colid');
      sc.columns = (sc.columns||[]).filter(c=>c.id!==colId);
      await saveDataNow();
      go('classPanel',{classId:cls.id,tab:'scales'});
    });
  });

  root.querySelectorAll('[data-activecell]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const sid = btn.getAttribute('data-studentid') || btn.getAttribute('data-activecell');
      const col = getActiveColumn(sc);
      col.values[sid] = nextValue(col.values[sid]);
      sc.calledIds = sc.calledIds || [];
      if(col.values[sid]===''){
        sc.calledIds = sc.calledIds.filter(x=>x!==sid);
      } else if(!sc.calledIds.includes(sid)){
        sc.calledIds.push(sid);
      }
      await saveDataNow();
      go('classPanel',{classId:cls.id,tab:'scales'});
    });
  });

  function showPicked(student, freshCycle){
    const area = document.getElementById('picked-area-'+sc.id);
    if(!area) return;
    area.innerHTML =
      (freshCycle ? '<p class="muted">🔄 Herkes kalktı, yeni tur başladı.</p>' : '')+
      '<div class="card" style="text-align:center;">'+
      '<div style="font-family:Georgia,serif;font-size:1.3rem;margin-bottom:.7rem;">'+esc(student.name)+'</div>'+
      '<div class="row" style="justify-content:center;">'+
      '<button data-mark="+">+</button>'+
      '<button class="ghost" data-mark="~">½</button>'+
      '<button class="danger" data-mark="-">−</button>'+
      '</div></div>';
    area.querySelectorAll('[data-mark]').forEach(mb=>{
      mb.addEventListener('click', async ()=>{
        const mark = mb.getAttribute('data-mark');
        const sid = pendingPick[sc.id];
        if(!sid) return;
        const col = getActiveColumn(sc);
        col.values[sid] = mark;
        sc.calledIds = sc.calledIds || [];
        if(!sc.calledIds.includes(sid)) sc.calledIds.push(sid);
        delete pendingPick[sc.id];
        await saveDataNow();
        go('classPanel',{classId:cls.id,tab:'scales'});
      });
    });
  }

  const pickBtn = root.querySelector('[data-pick="'+sc.id+'"]');
  if(pickBtn) pickBtn.addEventListener('click', ()=>{
    sc.calledIds = sc.calledIds || [];
    let remaining = students.filter(s=>!sc.calledIds.includes(s.id));
    let freshCycle = false;
    if(remaining.length===0 && students.length>0){ sc.calledIds = []; sc.currentColumnId = null; remaining = students.slice(); freshCycle = true; }
    if(remaining.length===0) return;
    const picked = remaining[Math.floor(Math.random()*remaining.length)];
    pendingPick[sc.id] = picked.id;
    speakName(picked.name);
    showPicked(picked, freshCycle);
  });
  const resetBtn = root.querySelector('[data-resetcycle="'+sc.id+'"]');
  if(resetBtn) resetBtn.addEventListener('click', async ()=>{
    if(!confirm('Turu sıfırlamak istediğine emin misin? Herkes tekrar seçilebilir olacak.')) return;
    sc.calledIds = [];
    sc.currentColumnId = null;
    delete pendingPick[sc.id];
    await saveDataNow();
    go('classPanel',{classId:cls.id,tab:'scales'});
  });
  root.querySelectorAll('[data-manualpick]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const sid = btn.getAttribute('data-studentid');
      const student = students.find(s=>s.id===sid);
      if(!student) return;
      pendingPick[sc.id] = sid;
      speakName(student.name);
      showPicked(student, false);
    });
  });
  const delBtn = root.querySelector('[data-delscale]');
  if(delBtn) delBtn.addEventListener('click', async ()=>{
    if(!confirm('Bu ölçeği ve tüm verilerini silmek istediğine emin misin?')) return;
    delete cls.scales[sc.id];
    await saveDataNow();
    go('classPanel',{classId:cls.id,tab:'scales'});
  });
}

function scaleDetailsHtml(sc, students){

function wireScale(cls, scaleId, students){
  const sc = cls.scales[scaleId];
  if(sc.type==='participation'){ wireParticipation(cls, sc, students); return; }
  wireScaleRename(cls, sc);
  const root = document.getElementById('scale-'+scaleId);
  if(!root) return;

  wireGridCells(cls, sc, students, root);
  const addColBtn = root.querySelector('[data-addcol="'+scaleId+'"]');
  if(addColBtn){
    addColBtn.addEventListener('click', async ()=>{
      const inp = document.getElementById('colname-'+scaleId);
      const label = inp.value.trim();
      if(!label) return;
      sc.columns = sc.columns||[];
      sc.columns.push({id:uid(), label, values:{}});
      await saveDataNow();
      go('classPanel',{classId:cls.id,tab:'scales'});
    });
  }
  root.querySelectorAll('[data-delcol]').forEach(btn=>{
    btn.addEventListener('click', async (ev)=>{
      ev.preventDefault();
      if(!confirm('Bu sütunu silmek istediğine emin misin?')) return;
      const sid = btn.getAttribute('data-delcol');
      const colId = btn.getAttribute('data-colid');
      const target = cls.scales[sid];
      target.columns = (target.columns||[]).filter(c=>c.id!==colId);
      await saveDataNow();
      go('classPanel',{classId:cls.id,tab:'scales'});
    });
  });
  const delScaleBtn = root.querySelector('[data-delscale]');
  if(delScaleBtn){
    delScaleBtn.addEventListener('click', async ()=>{
      if(!confirm('Bu ölçeği ve tüm verilerini silmek istediğine emin misin?')) return;
      delete cls.scales[scaleId];
      await saveDataNow();
      go('classPanel',{classId:cls.id,tab:'scales'});
    });
  }
}

function getScopeValues(sc, scope){
  const [sid, colId] = scope.split(':');
  const col = (sc.columns||[]).find(c=>c.id===colId);
  col.values = col.values || {};
  return col.values;
}

/* ---------- STUDENT SIDE ---------- */
function renderStudentLogin(app){
  const classes = Object.values(DATA.classes);
  app.innerHTML = header('Öğrenci girişi') + '<button class="backline" id="back">← Geri</button>'+
    '<div class="card">'+
    (classes.length ?
      '<label style="margin-top:0;">Şifreni gir</label>'+
      '<input type="text" id="s-pw-only" inputmode="text" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:.1em;font-size:1.1rem;text-align:center;" placeholder="ŞİFREN">'+
      '<p class="err" id="s-err" style="display:none;"></p>'+
      '<div style="margin-top:.7rem;"><button id="s-go">Giriş yap</button></div>'
      : '<p class="muted">Henüz sınıf tanımlanmadı.</p>')+
    '</div>';
  document.getElementById('back').onclick=()=>go('landing');
  if(!classes.length) return;
  const tryLogin=()=>{
    const pw = document.getElementById('s-pw-only').value.trim().toUpperCase();
    const errEl = document.getElementById('s-err');
    errEl.style.display='none';
    if(!pw){ errEl.textContent='Şifreni gir.'; errEl.style.display='block'; return; }
    let found = null;
    for(const cls of classes){
      for(const st of Object.values(cls.students)){
        if(st.password === pw){ found = {classId:cls.id, studentId:st.id}; break; }
      }
      if(found) break;
    }
    if(!found){ errEl.textContent='Böyle bir şifre bulunamadı. Kontrol edip tekrar dene.'; errEl.style.display='block'; return; }
    logStudentVisit(found.classId, found.studentId);
    go('studentView', found);
  };
  document.getElementById('s-go').onclick=tryLogin;
  document.getElementById('s-pw-only').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
}

function renderStudentView(app){
  const cls = DATA.classes[ctx.classId];
  const st = cls && cls.students[ctx.studentId];
  if(!cls || !st){ go('landing'); return; }
  const scales = Object.values(cls.scales);
  let sections = '';
  scales.forEach(sc=>{
    const scPct = scaleStudentPercent(sc, st.id);
    sections += '<h2 class="section">'+esc(sc.name)+(scPct!=null?' <span class="pill">%'+Math.round(scPct)+' başarı</span>':'')+'</h2>';
    {
      const cols=(sc.columns||[]).slice().reverse();
      const rows = cols.filter(c=>(c.values||{})[st.id]!=null && (c.values||{})[st.id]!=='');
      if(!rows.length) sections += '<div class="empty">Henüz kayıt yok.</div>';
      else rows.forEach(c=>{
        const v = c.values[st.id];
        if(sc.type==='addable_score'){
          sections += '<div class="entry-row"><span>'+esc(c.label)+'</span><strong>'+esc(v)+'</strong></div>';
        } else {
          sections += '<div class="entry-row '+(v==='-'?'neg':v==='~'?'half':'')+'"><span>'+esc(c.label)+'</span><strong style="font-size:1.15rem;">'+cellSymbol(v)+'</strong></div>';
        }
      });
    }
  });
  const assignments = (cls.assignments||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  let hwSection = '<h2 class="section">Verilen ödevler</h2>' +
    (assignments.length ? assignments.map(it=>'<div class="card" style="padding:.7rem .9rem;margin-bottom:.5rem;">'+
      '<div style="display:flex;justify-content:space-between;gap:.5rem;"><strong>'+esc(fmtDate(it.date))+'</strong>'+
      (it.link ? '<a href="'+esc(it.link)+'" target="_blank" rel="noopener"><button class="ghost small">📄 Dosyayı aç</button></a>' : '')+
      '</div><p style="margin:.3rem 0 0;">'+esc(it.text)+'</p></div>').join('') : '<div class="empty">Henüz ödev girilmedi.</div>');
  app.innerHTML = header('Merhaba, '+st.name, cls.name) +
    '<button class="backline" id="back">← Çıkış yap</button>'+
    (st.note ? '<div class="card"><label style="margin-top:0;">Öğretmen notu</label><p style="margin:0;">'+esc(st.note)+'</p></div>' : '') +
    hwSection +
    (scales.length ? sections : '<div class="empty">Henüz ölçek tanımlanmadı.</div>') +
    (cls.isHomeroom ? '<div id="books-section"></div>' : '');
  document.getElementById('back').onclick=()=>go('landing');
  if(cls.isHomeroom) renderMyBooksSection(st);
}

function renderMyBooksSection(st){
  const area = document.getElementById('books-section');
  if(!area) return;
  if(myReadingLogCache[st.id]){
    renderMyBooksContent(area, st, myReadingLogCache[st.id]);
    return;
  }
  area.innerHTML = '<h2 class="section">Okuduğum kitaplar</h2><div class="loading">Yükleniyor…</div>';
  fetchStudentReadingLog(st.id).then(entries=>{
    myReadingLogCache[st.id] = entries;
    if(view==='studentView' && ctx.studentId===st.id) renderMyBooksSection(st);
  });
}

function renderMyBooksContent(area, st, entries){
  const books = entries.filter(e=>!e.deleted).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const totalPages = books.reduce((sum,b)=>sum+(parseInt(b.pages)||0),0);
  area.innerHTML =
    '<h2 class="section">Okuduğum kitaplar</h2>'+
    '<p class="muted">Toplam '+books.length+' kitap · '+totalPages+' sayfa</p>'+
    (books.length ? books.map(b=>'<div class="list-row" id="mybkrow-'+b.id+'"><span>'+esc(b.title)+' <span class="muted">('+esc(b.pages)+' sayfa)</span></span>'+
      '<span class="row" style="flex:0;gap:.4rem;"><button class="ghost small" data-myeditbk="'+b.id+'">Düzenle</button><button class="danger small" data-mydelbk="'+b.id+'">Sil</button></span></div>').join('') : '<div class="empty">Henüz kitap eklemedin.</div>')+
    '<div class="card" style="margin-top:.8rem;"><label style="margin-top:0;">Yeni kitap ekle</label>'+
    '<input type="text" id="mybk-title" placeholder="Kitap adı">'+
    '<label>Sayfa sayısı</label><input type="text" id="mybk-pages" inputmode="numeric" placeholder="Örn: 150">'+
    '<p class="err" id="mybk-err" style="display:none;"></p>'+
    '<div style="margin-top:.6rem;"><button id="mybk-add">Ekle</button></div></div>';
  document.getElementById('mybk-add').onclick=async ()=>{
    const title=document.getElementById('mybk-title').value.trim();
    const pages=document.getElementById('mybk-pages').value.trim();
    const errEl=document.getElementById('mybk-err');
    if(!title||!pages){ errEl.textContent='Kitap adı ve sayfa sayısı gir.'; errEl.style.display='block'; return; }
    try{
      await readingLogCollection().add({classId:ctx.classId, studentId:st.id, title, pages, date: todayISO(), addedBy:'student', pass: st.password});
      delete myReadingLogCache[st.id];
      renderMyBooksSection(st);
    }catch(e){
      errEl.textContent='Kaydedilemedi, tekrar dene.';
      errEl.style.display='block';
    }
  };
  area.querySelectorAll('[data-mydelbk]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Bu kitabı silmek istediğine emin misin?')) return;
      const id = btn.getAttribute('data-mydelbk');
      try{
        await readingLogCollection().doc(id).update({deleted:true, pass: st.password});
        delete myReadingLogCache[st.id];
        renderMyBooksSection(st);
      }catch(e){ alert('Silinemedi, tekrar dene.'); }
    });
  });
  area.querySelectorAll('[data-myeditbk]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-myeditbk');
      const entry = entries.find(e=>e.id===id);
      if(!entry) return;
      const row = document.getElementById('mybkrow-'+id);
      row.innerHTML = '<div class="row" style="width:100%;">'+
        '<input type="text" id="emybk-title-'+id+'" value="'+esc(entry.title)+'">'+
        '<input type="text" id="emybk-pages-'+id+'" value="'+esc(entry.pages)+'" style="max-width:5rem;">'+
        '<button class="ghost small" id="emybk-save-'+id+'">Kaydet</button>'+
        '</div>';
      document.getElementById('emybk-save-'+id).onclick=async ()=>{
        const title=document.getElementById('emybk-title-'+id).value.trim();
        const pages=document.getElementById('emybk-pages-'+id).value.trim();
        if(!title||!pages) return;
        try{
          await readingLogCollection().doc(id).update({title, pages, pass: st.password});
          delete myReadingLogCache[st.id];
          renderMyBooksSection(st);
        }catch(e){ alert('Kaydedilemedi.'); }
      };
    });
  });
}

/* ==== Ana ekrana ekleme (PWA) ==== */
let deferredInstallPrompt = null;
let installBannerDismissed = false;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  renderInstallBanner();
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  const el = document.getElementById('install-banner');
  if(el) el.remove();
});
window.addEventListener('load', ()=>{
  setTimeout(()=>{
    if(!deferredInstallPrompt && !installBannerDismissed && !document.getElementById('install-banner')){
      renderInstallBanner(true);
    }
  }, 2500);
});
function isIos(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function renderInstallBanner(genericFallback){
  if(installBannerDismissed || isStandalone()) return;
  const app = document.getElementById('app');
  if(!app || document.getElementById('install-banner')) return;
  let html = '';
  if(deferredInstallPrompt){
    html = '<div id="install-banner" class="card" style="display:flex;justify-content:space-between;align-items:center;gap:.6rem;">'+
      '<span>📲 Bu sayfayı ana ekranına ekleyebilirsin.</span>'+
      '<span class="row" style="flex:0;gap:.4rem;"><button class="small" id="install-yes">Ekle</button><button class="ghost small" id="install-no">×</button></span></div>';
  } else if(isIos()){
    html = '<div id="install-banner" class="card" style="display:flex;justify-content:space-between;align-items:center;gap:.6rem;">'+
      '<span>📲 Ana ekrana eklemek için: alttaki paylaş simgesine (□↑) dokun → "Ana Ekrana Ekle".</span>'+
      '<button class="ghost small" id="install-no">×</button></div>';
  } else if(genericFallback){
    html = '<div id="install-banner" class="card" style="display:flex;justify-content:space-between;align-items:center;gap:.6rem;">'+
      '<span>📲 Ana ekrana eklemek için tarayıcı menüsünden (⋮ veya ☰) "Ekle" → "Ana ekrana ekle" seçeneğini kullan.</span>'+
      '<button class="ghost small" id="install-no">×</button></div>';
  } else {
    return;
  }
  app.insertAdjacentHTML('afterbegin', html);
  const yesBtn = document.getElementById('install-yes');
  if(yesBtn) yesBtn.onclick = async ()=>{
    const el = document.getElementById('install-banner');
    if(el) el.remove();
    if(deferredInstallPrompt){ deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice; deferredInstallPrompt = null; }
  };
  const noBtn = document.getElementById('install-no');
  if(noBtn) noBtn.onclick = ()=>{ installBannerDismissed = true; const el=document.getElementById('install-banner'); if(el) el.remove(); };
}

init();

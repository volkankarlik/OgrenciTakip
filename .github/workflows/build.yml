name: Veli uygulamasi APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE_URL: "https://volkanhoca.vercel.app"
  APP_NAME: "Volkan Hoca"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Proje dosyalarini olustur
        run: |
          mkdir -p proje/app/src/main/java/tr/volkanhoca/veli
          mkdir -p proje/app/src/main/res/drawable
          cd proje

          cat > settings.gradle <<'EOF_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VeliApp"
          include ':app'
          EOF_SETTINGS

          cat > build.gradle <<'EOF_ROOT'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_ROOT

          cat > gradle.properties <<'EOF_PROPS'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF_PROPS

          cat > app/build.gradle <<'EOF_APP'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'tr.volkanhoca.veli'
              compileSdk 34
              defaultConfig {
                  applicationId 'tr.volkanhoca.veli'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_APP

          cat > app/src/main/AndroidManifest.xml <<'EOF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="__APP_NAME__"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_ICON'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp"
              android:height="96dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
              <path
                  android:fillColor="#2F6B4F"
                  android:pathData="M48,48m-48,0a48,48 0,1 1,96 0a48,48 0,1 1,-96 0" />
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="8"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M28,50 L42,64 L70,34" />
          </vector>
          EOF_ICON

          cat > app/src/main/java/tr/volkanhoca/veli/MainActivity.java <<'EOF_JAVA'
          package tr.volkanhoca.veli;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private static final String SITE_URL = "__SITE_URL__";
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  final String host = Uri.parse(SITE_URL).getHost();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          String h = u.getHost();
                          if (h != null && h.equals(host)) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception e) {
                              // acilamadi, yok say
                          }
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              String html = "<html><head><meta name='viewport' content='width=device-width,initial-scale=1'></head>"
                                  + "<body style='font-family:sans-serif;text-align:center;padding:3rem 1rem;'>"
                                  + "<h2>Bağlantı kurulamadı</h2>"
                                  + "<p>İnternet bağlantını kontrol edip tekrar dene.</p>"
                                  + "<button style='font-size:1.1rem;padding:.7rem 1.4rem;' onclick=\"location.href='" + SITE_URL + "'\">Tekrar dene</button>"
                                  + "</body></html>";
                              view.loadDataWithBaseURL(null, html, "text/html", "utf-8", null);
                          }
                      }
                  });

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(SITE_URL);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  webView.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF_JAVA

          sed -i "s|__SITE_URL__|${SITE_URL}|g" app/src/main/java/tr/volkanhoca/veli/MainActivity.java
          sed -i "s|__APP_NAME__|${APP_NAME}|g" app/src/main/AndroidManifest.xml

      - name: APK derle
        working-directory: proje
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK dosyasini hazirla
        run: cp proje/app/build/outputs/apk/debug/app-debug.apk veli-takip.apk

      - name: Actions ciktisi olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: veli-takip-apk
          path: veli-takip.apk

      - name: Release olarak yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum veli-takip.apk --title "Veli uygulaması (son sürüm)" --notes "APK dosyasını indirip telefona kurabilirsiniz."
